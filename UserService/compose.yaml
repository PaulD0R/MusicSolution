services:
  userservice.api:
    image: userservice.api
    build:
      context: .
      dockerfile: UserService.API/Dockerfile
    environment:
      - ConnectionStrings__Postgres=Host=user-postgres;Port=5432;Database=music_user;Username=pauldor;Password=asdfgh67;
      
      - ConnectionStrings__Redis=redis:6379,abortConnect=false
          
      - ConnectioStrings_YARP=yarp-music:8080
      
      - Kafka__PersonCreated__BootstrapServers=kafka-server:9092
      - Kafka__PersonCreated__Topic=person-created

      - Kafka__PersonDeleted__BootstrapServers=kafka-server:9092
      - Kafka__PersonDeleted__Topic=person-deleted

      - Kafka__PersonUpdated__BootstrapServers=kafka-server:9092
      - Kafka__PersonUpdated__Topic=person-updated
        
      - Jwt__Issuer:Issuer
      - Jwt__Audience:Audience
      - Jwt__Secret:8Yd1CYLqzRzPF7Ntzdrp72KGb2aBG/4kGxYZE6ImuOo=
    networks:
      - music-solution-network
    depends_on:
      postgres:
        condition: service_healthy
          

  postgres:
    image: postgres:16.11
    container_name: user-postgres
    environment:
      POSTGRES_DB: "music_user"
      POSTGRES_USER: "pauldor"
      POSTGRES_PASSWORD: "asdfgh67"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pauldor -d music_user" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Databases/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - music-solution-network
      
volumes:
  postgres_data:
    
networks:
  music-solution-network:
    external: true