services:
  commentservice.api:
    image: commentservice.api
    build:
      context: .
      dockerfile: CommentService.API/Dockerfile 
    environment:
      - ConnectionStrings__Postgres=Host=comment-postgres;Port=5432;Database=music_comment;Username=pauldor;Password=asdfgh67;KeepAlive=30;Pooling=true;

      - ConnectionStrings__Redis=redis:6379
      - Redis__InstanceName=CommentService
        
      - ConnectioStrings_YARP=yarp-music:8080

      - Comment__VideoStartPath=/app/Videos
      - Comment__PictureStartPath=/app/Pictures

      - Logs__Path=/app/Logs/log-.txt
       
      - Kafka__PersonCreated__BootstrapServers=kafka-server:9092
      - Kafka__PersonCreated__Topic=person-created
      - Kafka__PersonCreated__GroupId=comment-service-create-person
        
      - Kafka__PersonDeleted__BootstrapServers=kafka-server:9092
      - Kafka__PersonDeleted__Topic=person-deleted
      - Kafka__PersonDeleted__GroupId=comment-service-delete-person

      - Kafka__MusicDeleted__BootstrapServers=kafka-server:9092
      - Kafka__MusicDeleted__Topic=music-deleted
      - Kafka__MusicDeleted__GroupId=comment-service-delete-music
        
      - FFmpeg__Path=/usr/bin
      - Jwt__Issuer=Issuer
      - Jwt__Audience=Audience
      - Jwt__Secret=8Yd1CYLqzRzPF7Ntzdrp72KGb2aBG/4kGxYZE6ImuOo=
    networks:
      - music-solution-network
    volumes:
        - video_data:/app/Videos
        - picture_data:/app/Pictures
        - logs_data:/app/Logs/log-.txt
    depends_on:
      postgres:
        condition: service_healthy


  postgres:
    image: postgres:16.11
    container_name: comment-postgres
    environment:
      POSTGRES_DB: "music_comment"
      POSTGRES_USER: "pauldor"  
      POSTGRES_PASSWORD: "asdfgh67"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pauldor -d music_comment" ]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Databases/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - music-solution-network

networks:
  music-solution-network:
    external: true
volumes:
  postgres_data:
  video_data:
  picture_data:
  logs_data:
